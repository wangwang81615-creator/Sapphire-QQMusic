name: Build Sapphire (QQMusic custom)

on:
  workflow_dispatch:
  push:
    branches: [qqmusic-lyrics]

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild \
            -project Sapphire.xcodeproj \
            -scheme Sapphire \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Ad-hoc sign and package
        run: |
          APP="build/Build/Products/Release/Sapphire.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep "$APP"
          cd "$(dirname "$APP")"
          zip -qry "$RUNNER_TEMP/Sapphire-QQMusic.zip" Sapphire.app
          mkdir -p artifact
          cp "$RUNNER_TEMP/Sapphire-QQMusic.zip" artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sapphire-QQMusic
          path: artifact/Sapphire-QQMusic.zip
          retention-days: 14
